name: Build and Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches:
      - main
      - master
      - web-version
      - release/2.1.2
      - develop
      - hotfix/login-overhead
      - feature/move-course-to-semester
      - hotfix/import_for

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        working-directory: ./degreez
        run: flutter pub get

      - name: Create .env file for web build
        working-directory: ./degreez
        run: |
          echo "WEB_API_KEY=AIzaSyAhjdzM_Eb6satYCro6ZwPKWBHi-CFHM6A" > .env
          echo "WEB_APP_ID=1:557089994187:web:d2bea349b681ac8743f24e" >> .env
          echo "WEB_MESSAGING_SENDER_ID=557089994187" >> .env
          echo "WEB_PROJECT_ID=degreez-fbec6" >> .env
          echo "WEB_STORAGE_BUCKET=degreez-fbec6.firebasestorage.app" >> .env
          echo "WEB_AUTH_DOMAIN=degreez-fbec6.firebaseapp.com" >> .env
          echo "WEB_MEASUREMENT_ID=" >> .env
          echo "WEB_GOOGLE_CLIENT_ID=557089994187-jp2craaq3akgo35l1ughg0gd53d3tpn4.apps.googleusercontent.com" >> .env

      - name: Build web
        working-directory: ./degreez
        run: flutter build web --release

      - name: Setup Node (for firebase-tools)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only hosting:degreez --project degreez-fbec6 --token "$FIREBASE_TOKEN"
