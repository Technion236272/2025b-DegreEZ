name: Build and Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches:
      - main
      - master
      - web-version

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Install dependencies
        working-directory: ./degreez
        run: flutter pub get

      - name: Build web
        working-directory: ./degreez
        run: flutter build web --release

      - name: Setup Node (for firebase-tools)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          # Ensure project id is set explicitly
          firebase deploy --only hosting --project degreez-fbec6 --token "$FIREBASE_TOKEN"
